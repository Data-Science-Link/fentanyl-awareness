name: Weekly Data Refresh & Publishing

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
    - name: Display context
      run: |
        echo "Weekly data refresh starting"
        echo "Commit: ${GITHUB_SHA:0:7}"
        echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd data_engineering
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install dbt-core dbt-duckdb

    - name: Extract CDC SODA data
      run: python data_engineering/data_sources/cdc_api/soda_extractor.py

    - name: Extract Census PEP population
      run: python data_engineering/data_sources/census_pep/pep_extractor.py

    - name: Extract final NVSS T40.4 deaths
      run: python data_engineering/data_sources/nvss_wonder/wonder_extractor.py

    - name: Check for Census API key
      id: check_key
      run: |
        if [ -z "${{ secrets.CENSUS_API_KEY }}" ]; then
          echo "::warning::CENSUS_API_KEY is not set. ACS income and unemployment stay on the last committed seed until the secret is added. Death rates use Census PEP and do not need this key."
          echo "has_key=false" >> $GITHUB_OUTPUT
        else
          echo "has_key=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract US Census ACS income and unemployment
      if: steps.check_key.outputs.has_key == 'true'
      env:
        CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      run: python data_engineering/data_sources/census_acs/census_extractor.py

    - name: Set up dbt profiles
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml << EOF
        fentanyl_awareness:
          target: dev
          outputs:
            dev:
              type: duckdb
              path: 'fentanyl_awareness.duckdb'
              threads: 4
              schema: 'main'
        EOF

    - name: Install dbt packages
      run: |
        cd data_engineering/data_build_tool
        dbt deps --profiles-dir ~/.dbt

    - name: Load dbt seeds
      run: |
        cd data_engineering/data_build_tool
        dbt seed --profiles-dir ~/.dbt

    - name: Create Final_Datasets directory
      run: mkdir -p Final_Datasets

    - name: Run dbt models
      run: |
        cd data_engineering/data_build_tool
        dbt run --profiles-dir ~/.dbt

    - name: Run dbt tests
      run: |
        cd data_engineering/data_build_tool
        dbt test --profiles-dir ~/.dbt

    - name: Generate dbt documentation
      run: |
        cd data_engineering/data_build_tool
        dbt docs generate --profiles-dir ~/.dbt

    - name: Prepare docs for GitHub Pages
      run: |
        mkdir -p docs/dbt
        cp -r data_engineering/data_build_tool/target/* docs/dbt/
        cp website/index.html docs/
        cp Final_Datasets/fact_fentanyl_deaths_over_time.csv docs/
        cp Final_Datasets/fact_nvss_final_t40_4.csv docs/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        keep_files: false

    - name: Open or update data refresh pull request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add Final_Datasets/fact_fentanyl_deaths_over_time.csv
        git add Final_Datasets/fact_nvss_final_t40_4.csv
        git add data_engineering/data_build_tool/dbt/seeds/*.csv

        if git diff --staged --quiet; then
          echo "No seed or published CSV changes."
          exit 0
        fi

        git checkout -B automated/weekly-data-refresh
        git commit -m "chore: refresh CDC, NVSS, and census datasets"
        git push origin automated/weekly-data-refresh --force

        if gh pr list --head automated/weekly-data-refresh --state open --json number --jq 'length' | grep -qx '0'; then
          gh pr create \
            --base main \
            --head automated/weekly-data-refresh \
            --title "chore: weekly data refresh" \
            --body "Automated refresh of CDC VSRR T40.4 seeds, final NVSS incident deaths, Census PEP population, and the published fact tables. Pages was updated from this workflow. Auto-merge keeps main in sync after dbt-test and security-audit. This job does not push main directly."
        else
          echo "Updated existing weekly data refresh PR."
        fi

        # Auto-merge waits for the required status checks. It does not wait for
        # a human review only after an admin splits the review rule onto its
        # own ruleset and adds a GitHub Actions bypass. See the repository
        # ruleset notes in the README. Do not git push origin main.
        pr_number=$(gh pr list --head automated/weekly-data-refresh --state open --json number --jq '.[0].number')
        if [ -n "$pr_number" ]; then
          gh pr merge "$pr_number" --merge --auto \
            || echo "::warning::Could not enable auto-merge on PR #$pr_number. An admin must allow auto-merge and let GitHub Actions bypass the pull-request review ruleset."
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weekly-data-refresh
        path: |
          Final_Datasets/
          data_engineering/data_build_tool/target/
        retention-days: 30

    - name: Summary
      if: success()
      run: |
        echo "Weekly data refresh succeeded."
        echo "Portal: https://data-science-link.github.io/fentanyl-awareness/"
