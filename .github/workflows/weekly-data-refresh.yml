name: Publish portal

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'data_engineering/**'
      - 'Final_Datasets/**'
      - '.github/workflows/weekly-data-refresh.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-portal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Display context
      run: |
        echo "Portal publish starting"
        echo "Event: ${{ github.event_name }}"
        echo "Commit: ${GITHUB_SHA:0:7}"
        echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd data_engineering
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install dbt-core dbt-duckdb

    - name: Extract CDC SODA data
      run: python data_engineering/data_sources/cdc_api/soda_extractor.py

    - name: Extract Census PEP population
      run: python data_engineering/data_sources/census_pep/pep_extractor.py

    - name: Extract final NVSS T40.4 deaths
      run: python data_engineering/data_sources/nvss_wonder/wonder_extractor.py

    - name: Check for Census API key
      id: check_key
      run: |
        if [ -z "${{ secrets.CENSUS_API_KEY }}" ]; then
          echo "::warning::CENSUS_API_KEY is not set. ACS income and unemployment stay on the last committed seed until the secret is added. Death rates use Census PEP and do not need this key."
          echo "has_key=false" >> $GITHUB_OUTPUT
        else
          echo "has_key=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract US Census ACS income and unemployment
      if: steps.check_key.outputs.has_key == 'true'
      env:
        CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      run: python data_engineering/data_sources/census_acs/census_extractor.py

    - name: Set up dbt profiles
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml << EOF
        fentanyl_awareness:
          target: dev
          outputs:
            dev:
              type: duckdb
              path: 'fentanyl_awareness.duckdb'
              threads: 4
              schema: 'main'
        EOF

    - name: Install dbt packages
      run: |
        cd data_engineering/data_build_tool
        dbt deps --profiles-dir ~/.dbt

    - name: Load dbt seeds
      run: |
        cd data_engineering/data_build_tool
        dbt seed --profiles-dir ~/.dbt

    - name: Create Final_Datasets directory
      run: mkdir -p Final_Datasets

    - name: Run dbt models
      run: |
        cd data_engineering/data_build_tool
        dbt run --profiles-dir ~/.dbt

    - name: Run dbt tests
      run: |
        cd data_engineering/data_build_tool
        dbt test --profiles-dir ~/.dbt

    - name: Generate dbt documentation
      run: |
        cd data_engineering/data_build_tool
        dbt docs generate --profiles-dir ~/.dbt

    - name: Prepare Pages artifact
      run: |
        mkdir -p docs/dbt
        cp -r data_engineering/data_build_tool/target/* docs/dbt/
        cp website/index.html docs/
        cp Final_Datasets/fact_fentanyl_deaths_over_time.csv docs/
        cp Final_Datasets/fact_nvss_final_t40_4.csv docs/
        touch docs/.nojekyll

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

    - name: Upload debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weekly-data-refresh
        path: |
          Final_Datasets/
          data_engineering/data_build_tool/target/
        retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Summary
      run: |
        echo "Portal published from this run. HTML and data are the same snapshot."
        echo "Portal: https://data-science-link.github.io/fentanyl-awareness/"
        echo "Provisional CSV: https://data-science-link.github.io/fentanyl-awareness/fact_fentanyl_deaths_over_time.csv"
        echo "Final CSV: https://data-science-link.github.io/fentanyl-awareness/fact_nvss_final_t40_4.csv"
