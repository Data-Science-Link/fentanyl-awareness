version: 2

sources:
  - name: cdc_api_raw
    description: "CDC VSRR provisional overdose counts loaded from the SODA seed"
    schema: main
    tables:
      - name: cdc_api_provisional_overdose_counts
        description: "Raw extract of dataset xkb8-kh2a, T40.4 indicator only"

  - name: census_raw
    description: "US Census ACS 5-year estimates loaded from seeds"
    schema: main
    tables:
      - name: census_state_population
        description: "State-level ACS 5-year population (B01001_001E)"
      - name: census_state_economic
        description: "State-level ACS 5-year income and labor-force estimates"
      - name: census_pep_state_population
        description: "Census PEP July 1 resident population by state and year"

  - name: nvss_raw
    description: "Final NVSS T40.4 incident deaths from the CDC WONDER request form"
    schema: main
    tables:
      - name: nvss_final_t40_4_deaths
        description: "Annual and monthly final T40.4 drug-overdose deaths, 1999 through the latest final year"
