version: 2

models:
  - name: fact_fentanyl_deaths_over_time
    description: |
      Published fact table for provisional synthetic-opioid (T40.4) mortality.

      **What this is**
      - CDC VSRR 12-month ending counts from SODA dataset xkb8-kh2a
      - Indicator: Synthetic opioids, excl. methadone (T40.4). This includes
        fentanyl and other synthetics such as tramadol. It is not fentanyl-only.
      - Time span: 2015 through the latest month CDC has published
      - Geography: states, DC, New York City, Puerto Rico, and a national total

      **What this is not**
      - Monthly incident deaths. Do not sum `rolling_12_month_deaths` across months.
      - Final vital statistics. Counts are provisional and are revised.
      - Complete state coverage. Louisiana is commonly absent from T40.4 VSRR
        when CDC quality thresholds are not met.

      Death rates use Census PEP July 1 population (`population_source` =
      `Census PEP`). Income and unemployment stay on ACS 5-year estimates.
      When `population_year` is not the death-year label,
      `population_is_carried_forward` is true.

      `headline_deaths` is the CDC predicted count when that value exists and
      the month is within six months of the latest month in the file, or
      `percent_complete` is below 100, or the footnote flags underreporting
      or incomplete data. Otherwise it is the reported count. If the rule
      calls for a predicted count and CDC did not publish one, the headline
      falls back to the reported count.

      States with no VSRR row, including Louisiana, are present with
      `reporting_status = not_reportable` and null death counts.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - year
              - month
              - state

    columns:
      - name: year
        description: "End year of the 12-month reporting window"
        tests:
          - not_null

      - name: month
        description: "First day of the month that ends the 12-month window"
        tests:
          - not_null

      - name: state
        description: "Geography name"
        tests:
          - not_null

      - name: geo_type
        description: "nation, state, city, or territory"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['nation', 'state', 'city', 'territory']

      - name: rolling_12_month_deaths
        description: "Reported 12-month ending T40.4 deaths; null when suppressed"

      - name: predicted_12_month_deaths
        description: "CDC predicted 12-month ending count when published"

      - name: headline_deaths
        description: "Predicted count for recent or flagged months; otherwise the reported count"

      - name: headline_basis
        description: "predicted or reported, naming which column headline_deaths used"

      - name: is_suppressed
        description: "True when CDC withheld the reported count"
        tests:
          - not_null

      - name: footnote
        description: "CDC footnote text"

      - name: footnote_symbol
        description: "CDC footnote symbol (* or **)"

      - name: percent_complete
        description: "CDC percent completeness of death reporting"

      - name: percent_pending_investigation
        description: "CDC percent of records pending investigation"

      - name: reporting_status
        description: "reported, suppressed, or not_reportable"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['reported', 'suppressed', 'not_reportable']

      - name: data_source
        description: "Always 'CDC SODA API' on this provisional file"
        tests:
          - not_null

      - name: population
        description: "Census PEP July 1 population for the matched population_year. Null for New York City."

      - name: population_year
        description: "Year of the population estimate used for the rate"

      - name: population_source
        description: "Census PEP for nation, state, and territory rows that have a denominator"

      - name: median_household_income
        description: "ACS 5-year median household income for demographics_year"

      - name: unemployment_rate
        description: "ACS 5-year unemployment rate percentage for demographics_year"

      - name: demographics_year
        description: "ACS 5-year end year used for income and unemployment"

      - name: deaths_per_100k
        description: "rolling_12_month_deaths per 100,000 population when both are present"

      - name: predicted_deaths_per_100k
        description: "predicted_12_month_deaths per 100,000 population when both are present"

      - name: population_is_carried_forward
        description: "True when population_year is not the death-year label"
        tests:
          - not_null

      - name: extracted_at
        description: "UTC timestamp when the CDC seed was extracted"
