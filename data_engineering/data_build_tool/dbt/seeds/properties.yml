version: 2

seeds:
  - name: cdc_api_provisional_overdose_counts
    description: >
      Raw CDC VSRR SODA extract (dataset xkb8-kh2a), T40.4 indicator only.
      Empty data_value means CDC withheld the count.
    columns:
      - name: state
        description: Two-letter jurisdiction code (includes US, YC, PR)
      - name: year
        description: End year of the 12-month window
      - name: month
        description: Month name that ends the 12-month window
      - name: period
        description: CDC period label; pipeline keeps 12 month-ending
      - name: indicator
        description: Drug category
      - name: data_value
        description: Reported count; empty when suppressed
      - name: predicted_value
        description: CDC predicted count when published
      - name: extracted_at
        description: UTC extract timestamp
      - name: dataset_id
        description: SODA dataset identifier

  - name: census_state_population
    description: ACS 5-year total population by state and end year
    columns:
      - name: year
        description: ACS 5-year end year
      - name: state_name
        description: State or equivalent name
      - name: population
        description: ACS 5-year total population estimate
      - name: date_description
        description: Always 'ACS 5-Year Estimate'
      - name: extracted_at
        description: Extract timestamp

  - name: census_state_economic
    description: ACS 5-year income and labor-force estimates by state
    columns:
      - name: year
        description: ACS 5-year end year
      - name: unemployment_rate
        description: Unemployed / civilian labor force * 100; null when undefined
      - name: extracted_at
        description: Extract timestamp

  - name: census_pep_state_population
    description: Census PEP July 1 resident population used as the rate denominator
    columns:
      - name: year
        description: Estimate year
      - name: state_name
        description: United States, state, District of Columbia, or Puerto Rico
      - name: population
        description: July 1 resident population
      - name: vintage
        description: PEP vintage or intercensal file the row came from
      - name: population_source
        description: Always Census PEP
      - name: extracted_at
        description: UTC extract timestamp

  - name: nvss_final_t40_4_deaths
    description: >
      Final incident T40.4 drug-overdose deaths from the CDC WONDER
      request form (D77 and D157). Not a 12-month ending series.
    columns:
      - name: year
        description: Calendar year of death
      - name: month
        description: First of the month for monthly rows; empty for annual rows
      - name: period_type
        description: year or month
      - name: incident_deaths
        description: Deaths that month or year; empty when suppressed (1-9)
      - name: is_suppressed
        description: True when the count is 1-9
      - name: data_source
        description: Always NVSS final
      - name: source_dataset
        description: D77 for 1999-2017, D157 for 2018 through the latest final year
